services:
  app:
    image: scopetwin:build03
    build: .
    # Explicit allowlist: never give the web process the migration-owner password.
    environment:
      APP_NAME: ScopeTwin
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Set a unique release application key}
      APP_URL: ${APP_URL:?Set the release URL}
      APP_ALLOW_INSECURE_HTTP: ${APP_ALLOW_INSECURE_HTTP:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${RELEASE_DATABASE:?Set a new release database name}
      DB_USERNAME: scopetwin_runtime
      DB_PASSWORD: ${DB_PASSWORD:?Set a unique runtime database password}
      SESSION_DRIVER: database
      SESSION_COOKIE: ${SESSION_COOKIE:-scopetwin_release_session}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_HTTP_ONLY: true
      SESSION_SAME_SITE: lax
      SESSION_ENCRYPT: true
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-array}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ScopeTwin
      PASSWORD_RECOVERY_ENABLED: ${PASSWORD_RECOVERY_ENABLED:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_ALLOW_SETUP: ${DEMO_ALLOW_SETUP:-false}
    ports:
      - "127.0.0.1:${RELEASE_PORT:-18733}:8080"
    volumes:
      - release_storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  database:
    image: scopetwin-postgres:build03
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    environment:
      POSTGRES_DB: ${RELEASE_DATABASE:?Set a new release database name}
      POSTGRES_USER: scopetwin_owner
      POSTGRES_PASSWORD: ${RELEASE_DB_OWNER_PASSWORD:?Set a private migration-owner password}
    volumes:
      - release_database:/var/lib/postgresql
    # No published database port. Runtime receives a different DML-only role.
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scopetwin_owner -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  release_storage:
  release_database:
