services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: scopetwin
      POSTGRES_USER: scopetwin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - scopetwin_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopetwin -d scopetwin"]
      interval: 2s
      retries: 20
volumes:
  scopetwin_data:
